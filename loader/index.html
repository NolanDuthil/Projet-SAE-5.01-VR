<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page avec Image et Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <form id="uploadForm" action="/sae501/loader" method="post" enctype="multipart/form-data">
                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" name="file" accept=".zip">
                    <p>Déposez vos fichiers ici ou cliquez pour sélectionner</p>
                </div>
                <button type="submit">Uploader</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
